<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me | Mohamed Rafiq.M</title>
    <link rel="icon" type="image/png" href="1001440692-removebg-preview.png">
    <link rel="stylesheet" href="style.css">
    <style>
        .contact-container {
            max-width: 650px;
            margin: 50px auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-top: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group label {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.95rem;
        }
        .form-group input, .form-group textarea {
            padding: 12px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-light);
            color: var(--text-primary);
            border-radius: 8px;
            outline: none;
            font-size: 1rem;
            transition: border-color 0.2s ease;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 8px var(--glow-color);
        }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="logo">My Portfolio</div>
        
        <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle navigation menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>

        <nav class="nav-links" id="navLinks">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="certificate.html">Certificate</a>
            <a href="contact.html" class="active">Contact</a>

            <div class="nav-tools">
                <button class="terminal-toggle-btn" onclick="toggleTerminal()" title="Toggle Developer Terminal Mode">&gt;_</button>
                <span class="cmd-badge" onclick="toggleCommandPalette(true)">Ctrl + K</span>
            </div>
        </nav>
    </header>

    <main class="contact-container animate-fade-in">
        <h1 class="glow-text" style="text-align: center;">Get In Touch</h1>
        <p class="subtitle" style="text-align: center;">Have a project or opportunity in mind? Send me a message!</p>

        <!-- FormSubmit Integration -->
        <form class="contact-form" action="https://formsubmit.co/mohamedrafiqmt9@gmail.com" method="POST">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="message">Your Message</label>
                <textarea id="message" name="message" rows="5" placeholder="Type your message here..." required></textarea>
            </div>
            <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Send Message</button>
        </form>
    </main>

    <footer>
        <h2>Let's Connect</h2>
        <p>Email: <a href="mailto:mohamedrafiqmt9@gmail.com">mohamedrafiqmt9@gmail.com</a></p>
        <p><a href="https://www.linkedin.com/in/mohamed-rafiq-m-221591351" target="_blank" rel="noopener noreferrer">Connect on LinkedIn ↗</a></p>
    </footer>

    <button class="chat-toggle-btn pulse-glow" id="chatToggleBtn" aria-label="Open Chat">💬</button>

    <div class="chat-window hidden" id="chatWindow">
        <div class="chat-header">
            <h4>Ask Rafiq's Assistant 🤖</h4>
            <button class="chat-close-btn" id="chatCloseBtn">&times;</button>
        </div>
        
        <div class="chat-body" id="chatBody">
            <div class="chat-message bot">
                Hi! 👋 I'm Mohamed Rafiq's Virtual Assistant. How can I help you today?
            </div>
            <div class="chat-chips" id="chatChips">
                <button class="chip" onclick="handleChipClick('skills')">💻 Skills & Tools</button>
                <button class="chip" onclick="handleChipClick('projects')">📁 Projects</button>
                <button class="chip" onclick="handleChipClick('certificates')">📜 Certificates</button>
                <button class="chip" onclick="handleChipClick('contact')">📬 Contact Info</button>
                <button class="chip" onclick="handleChipClick('resume')">📄 Resume</button>
            </div>
        </div>

        <form class="chat-input-area" id="chatForm">
            <input type="text" id="chatInput" placeholder="Type a question..." autocomplete="off">
            <button type="submit">Send</button>
        </form>
    </div>

    <script src="chatbot.js"></script>
    <script src="terminal-palette-tilt.js"></script>
    <script>
        const menuBtn = document.getElementById('mobileMenuBtn');
        const navLinks = document.getElementById('navLinks');
        if (menuBtn) {
            menuBtn.addEventListener('click', () => {
                menuBtn.classList.toggle('active');
                navLinks.classList.toggle('open');
            });
        }
    </script>
</body>
</html>
